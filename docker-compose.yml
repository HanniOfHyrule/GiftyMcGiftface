services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:?DATABASE_USERNAME fehlt in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD fehlt in .env}
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME fehlt in .env}
      POSTGRES_HOST_AUTH_METHOD: md5
    # Nur lokal erreichbar (für `pnpm start:dev` und DB-Tools), nicht aus dem Netz
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET fehlt in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      # Anzahl Proxys vor dem Backend: 1 = nur nginx, 2 = nginx + z.B. Cloudflare/Caddy
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Öffentliche Adresse der App (für OAuth-Redirects, z.B. Todoist)
      APP_URL: ${APP_URL:-http://localhost:3000}
      TODOIST_CLIENT_ID: ${TODOIST_CLIENT_ID:-}
      TODOIST_CLIENT_SECRET: ${TODOIST_CLIENT_SECRET:-}
      TODOIST_ENCRYPTION_KEY: ${TODOIST_ENCRYPTION_KEY:-}
      # Zeitzone für "heute" bei Fälligkeiten und den täglichen Todoist-Sync
      TZ: ${TZ:-Europe/Berlin}
    # Die API läuft über den nginx-Proxy im Frontend (/api); Port nur lokal zum Debuggen
    ports:
      - '127.0.0.1:3001:3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-3000}:80'
    depends_on:
      backend:
        condition: service_healthy

  # Tägliches Datenbank-Backup nach ./backups, ältere als BACKUP_KEEP_DAYS werden gelöscht.
  # Wiederherstellen: gunzip -c backups/<datei>.sql.gz | docker compose exec -T postgres psql -U <user> -d <db>
  backup:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${DATABASE_USERNAME}
      PGPASSWORD: ${DATABASE_PASSWORD}
      PGDATABASE: ${DATABASE_NAME}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: >-
      sh -c 'while true; do
        file=/backups/gifty-$$(date +%Y%m%d-%H%M%S).sql.gz;
        if pg_dump --clean --if-exists | gzip > $$file; then echo "Backup erstellt: $$file"; else echo "Backup fehlgeschlagen" >&2; rm -f $$file; fi;
        find /backups -name "gifty-*.sql.gz" -mtime +$$BACKUP_KEEP_DAYS -delete;
        sleep 86400;
      done'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
